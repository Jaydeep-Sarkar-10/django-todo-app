<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
    --surface:rgba(15,23,42,.62);
    --surface-light:rgba(255,255,255,.07);
    --border:rgba(255,255,255,.13);
    --text:#f8fafc;
    --muted:#aebbd0;
    --primary:#818cf8;
    --primary-light:#60a5fa;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:32px 18px;
    overflow:hidden;
    position:relative;
    color:var(--text);
    background:
        radial-gradient(circle at 15% 15%, rgba(99,102,241,.24), transparent 30%),
        radial-gradient(circle at 85% 85%, rgba(14,165,233,.16), transparent 34%),
        linear-gradient(135deg,#060b18 0%,#111827 45%,#14142c 100%);
}

body::before{
    content:"";
    position:absolute;
    inset:0;
    opacity:.35;
    background-image:linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:linear-gradient(to bottom,black,transparent);
    pointer-events:none;
}

.blob{
    position:absolute;
    border-radius:50%;
    filter:blur(2px);
    pointer-events:none;
    background:radial-gradient(circle at 30% 30%,rgba(165,180,252,.5),rgba(79,70,229,.04) 70%);
    animation:float 12s ease-in-out infinite;
}

.blob:nth-child(1){
    width:420px;
    height:420px;
    top:-190px;
    left:-150px;
}

.blob:nth-child(2){
    width:480px;
    height:480px;
    bottom:-250px;
    right:-160px;
    background:radial-gradient(circle at 55% 40%,rgba(56,189,248,.28),rgba(37,99,235,.02) 70%);
    animation-duration:16s;
    animation-delay:-5s;
}

.blob:nth-child(3){
    width:220px;
    height:220px;
    bottom:10%;
    left:12%;
    opacity:.45;
    animation-duration:10s;
    animation-delay:-3s;
}

@keyframes float{
    0%,100%{
        transform:translate3d(0,0,0) scale(1);
    }
    50%{
        transform:translate3d(24px,-34px,0) scale(1.08);
    }
}

.signup-container{
    width:min(100%,430px);
    padding:46px;
    position:relative;
    z-index:2;
    overflow:hidden;
    background:linear-gradient(145deg,rgba(30,41,59,.76),rgba(15,23,42,.58));
    backdrop-filter:blur(24px) saturate(145%);
    -webkit-backdrop-filter:blur(24px) saturate(145%);
    border:1px solid var(--border);
    border-radius:28px;
    box-shadow:0 30px 80px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.08);
    animation:fade .8s cubic-bezier(.16,1,.3,1) both;
}

.signup-container::before{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    top:-145px;
    right:-115px;
    border-radius:50%;
    background:rgba(129,140,248,.18);
    filter:blur(20px);
    pointer-events:none;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(24px) scale(.98);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.signup-container h1{
    position:relative;
    text-align:center;
    font-size:clamp(29px,5vw,35px);
    line-height:1.2;
    letter-spacing:-1.2px;
    color:var(--text);
    margin-bottom:10px;
}

.subtitle{
    position:relative;
    text-align:center;
    color:var(--muted);
    font-size:14px;
    margin-bottom:34px;
}

.input-group{
    position:relative;
    margin-bottom:18px;
}

.input-group i{
    position:absolute;
    left:18px;
    top:50%;
    z-index:1;
    transform:translateY(-50%);
    color:#a5b4fc;
    font-size:15px;
    transition:.25s ease;
}

.input-group input{
    width:100%;
    min-height:54px;
    padding:15px 18px 15px 49px;
    border:1px solid rgba(255,255,255,.09);
    outline:none;
    border-radius:14px;
    background:var(--surface-light);
    color:white;
    font-size:14px;
    font-weight:400;
    transition:border-color .25s ease,background .25s ease,box-shadow .25s ease,transform .25s ease;
}

.input-group input::placeholder{
    color:#9ba9c0;
}

.input-group:focus-within i{
    color:#dbe4ff;
}

.input-group input:focus{
    background:rgba(255,255,255,.105);
    border-color:rgba(129,140,248,.78);
    box-shadow:0 0 0 4px rgba(99,102,241,.16),0 12px 26px rgba(0,0,0,.12);
    transform:translateY(-1px);
}

button{
    width:100%;
    min-height:55px;
    margin-top:6px;
    border:none;
    border-radius:14px;
    position:relative;
    overflow:hidden;
    font-size:15px;
    font-weight:600;
    letter-spacing:.1px;
    cursor:pointer;
    color:white;
    background:linear-gradient(135deg,#6366f1 0%,#4f7df3 55%,#38bdf8 100%);
    box-shadow:0 14px 28px rgba(79,70,229,.28);
    transition:transform .25s ease,box-shadow .25s ease,filter .25s ease;
}

button::before{
    content:"";
    position:absolute;
    top:0;
    left:-115%;
    width:70%;
    height:100%;
    transform:skewX(-22deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.24),transparent);
    transition:left .55s ease;
}

button i{
    margin-left:8px;
    transition:transform .25s ease;
}

button:hover{
    transform:translateY(-3px);
    filter:brightness(1.07);
    box-shadow:0 20px 36px rgba(79,70,229,.4);
}

button:hover::before{
    left:145%;
}

button:hover i{
    transform:translateX(3px);
}

button:active{
    transform:translateY(-1px);
}

.login-text{
    text-align:center;
    margin-top:27px;
    color:var(--muted);
    font-size:13px;
}

.login-text a{
    margin-left:3px;
    color:#a5b4fc;
    font-weight:600;
    text-decoration:none;
    transition:color .2s ease,text-shadow .2s ease;
}

.login-text a:hover{
    color:#dbe4ff;
    text-shadow:0 0 16px rgba(165,180,252,.5);
}

.error-message{
    position:relative;
    padding:12px 14px;
    border:1px solid rgba(252,165,165,.25);
    border-radius:12px;
    text-align:center;
    margin-bottom:21px;
    color:#fee2e2;
    background:rgba(127,29,29,.34);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
    font-size:13px;
    font-weight:500;
}

@media (max-width:520px){
    body{
        padding:20px 15px;
        overflow:auto;
    }

    .signup-container{
        padding:36px 25px;
        border-radius:24px;
    }

    .blob:nth-child(3){
        display:none;
    }
}

@media (prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
    }
}
</style>

</head>

<body>

<div class="blob"></div>
<div class="blob"></div>
<div class="blob"></div>

<div class="signup-container">

<h1>Create Account</h1>

<p class="subtitle">
Start your journey with us
</p>

{% if error %}
<div class="error-message">
    {{ error }}
</div>
{% endif %}

<form method="POST">

{% csrf_token %}

<div class="input-group">

<i class="fa-solid fa-user"></i>

<input
type="text"
name="username"
placeholder="Username"
required>

</div>

<div class="input-group">

<i class="fa-solid fa-lock"></i>

<input
type="password"
name="password"
placeholder="Password"
required>

</div>

<button type="submit">

Create Account
<i class="fa-solid fa-arrow-right"></i>

</button>

</form>

<p class="login-text">

Already have an account?

<a href="{% url 'login' %}">

Login

</a>

</p>

</div>

</body>
</html>
